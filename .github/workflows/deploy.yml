# Push to main -> deploy https://xrpl.bxbox.tech via the Coolify API.
# The Coolify app uses a public GitHub source (no webhook), so this triggers it.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "https://coolify.bxbox.tech/api/v1/deploy?uuid=lquqq7j59nh52pv0tlt527nw&force=false"
