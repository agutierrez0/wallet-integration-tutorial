version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: ["/", "/server"]
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /scripts/python
    schedule:
      interval: monthly
