name: xrpl-wallet-sandbox-dev

services:
  web:
    build:
      context: .
      target: builder
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://server:3001
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sandbox

  server:
    build:
      context: ./server
      target: builder
    working_dir: /app
    volumes:
      - ./server/src:/app/src
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file: ./server/.env
    environment:
      ALLOWED_ORIGIN: http://localhost:3000
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sandbox

networks:
  sandbox:
    name: xrpl-wallet-sandbox-dev-network
