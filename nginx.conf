server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP. In Coolify this container sits behind Traefik, so $remote_addr is the proxy's
    # private Docker IP. Trust X-Forwarded-For ONLY from private ranges; a client connecting
    # directly from the internet has a public $remote_addr, so its own X-Forwarded-For is ignored.
    # real_ip_recursive picks the right-most address that is not a trusted proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers. Declared at server level only: nginx drops inherited add_header values in
    # any location that declares its own, so do not add add_header inside the locations below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://s.altnet.rippletest.net:51233 https://s.altnet.rippletest.net:51234 wss://s.devnet.rippletest.net:51233 https://s.devnet.rippletest.net:51234 wss://xrplcluster.com https://xrplcluster.com https://faucet.altnet.rippletest.net https://faucet.devnet.rippletest.net; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Same-origin proxy to the signing backend, so the browser never needs CORS.
    # After real_ip, $remote_addr is the true client. The server must see exactly that one value,
    # never a client-supplied X-Forwarded-For chain, so overwrite it instead of appending.
    location /api/ {
        proxy_pass http://xrpl-wallet-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's security headers (above) win over the API's own copies
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
}
